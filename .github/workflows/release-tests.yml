name: Clean release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-test.lock
            sto_rag/nc5/requirements.txt
            normcontrol-web/requirements.txt
      - run: python -m pip install -r requirements-test.txt -c requirements-test.lock
      - run: python -m pip check
      - run: python tools/test_release.py
