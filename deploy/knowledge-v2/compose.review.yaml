# Separate orchestration avoids head-of-line blocking behind a long normative analysis.
# GPU turns remain serialized through the SAME canonical volume/resource key.
services:
  review-worker:
    extends:
      file: compose.yaml
      service: knowledge-worker
    image: ${KNOWLEDGE_REVIEW_IMAGE:-normcontrol/review-worker:1.0.0}
    environment:
      KNOWLEDGE_REVIEW_ONLY: "1"
      KNOWLEDGE_SKIP_REVIEW: "0"
    cpus: 1.0
    mem_limit: 4g
    stop_grace_period: 10m
